# ==================== Produktions-Konfiguration für Render ====================
# WICHTIG: Render's automatisch generierte DATABASE_URL hat das Format: postgresql://user:pass@host:port/db
# Spring Boot benötigt aber: jdbc:postgresql://user:pass@host:port/db
#
# LÖSUNG: Im Render Dashboard eine NEUE Umgebungsvariable hinzufügen:
#   Name: JDBC_DATABASE_URL
#   Wert: DATABASE_URL kopieren und "jdbc:" Prefix hinzufügen
#   Beispiel: jdbc:postgresql://user:pass@dpg-xxxxx.oregon-postgres.render.com/dbname
#
# Die URL enthält bereits Username und Password, daher keine separaten Credentials nötig!
spring.datasource.url=jdbc:postgresql://dpg-d3nscbumcj7s73d77n20-a.oregon-postgres.render.com:5432/hydration_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== Server Konfiguration ====================
server.port=${PORT:8080}

# ==================== JPA / Hibernate Konfiguration ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Dialect explizit setzen für Render Deployment
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==================== Verbindungspool (HikariCP) ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==================== Logging Konfiguration ====================
logging.level.root=INFO
logging.level.com.example.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# ==================== Actuator Konfiguration ====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true

# ==================== CORS Konfiguration - Produktion ====================
app.cors.allowed-origins=${FRONTEND_URL:https://your-frontend.onrender.com},http://localhost:5173

# ==================== Jackson Konfiguration ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ==================== Fehlerbehandlung ====================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
