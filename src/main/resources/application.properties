# ==================== Anwendungs-Konfiguration ====================
spring.application.name=HydrateMate Backend
server.port=${PORT:8080}

# ==================== Datenbank-Konfiguration ====================
# Datasource wird in application-prod.properties (Production) konfiguriert
# Lokale Entwicklung: Überschreibe diese Properties in deiner IDE oder mit Environment Variables
# Set DB_USERNAME and DB_PASSWORD as environment variables in production
spring.datasource.url=jdbc:postgresql://localhost:5432/hydration
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / Hibernate Konfiguration ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Hinweis: Hibernate 6 (Spring Boot 3.x) erkennt den Dialekt automatisch, explizite Angabe nicht nötig
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==================== Verbindungspool (HikariCP) ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==================== Logging Konfiguration ====================
logging.level.root=INFO
logging.level.com.example.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================== Actuator Konfiguration ====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true

# ==================== CORS Konfiguration ====================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ==================== Jackson Konfiguration ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ==================== Fehlerbehandlung ====================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
